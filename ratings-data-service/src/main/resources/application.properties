spring.application.name=ratings-data-service 
#service name to register with eureka server
server.port=8083
 #multiple microservices can run on different ports

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Without Eureka:

# Service A must know exact IP of Service B 

# With Eureka:

# Service A just says: "call ratings-data-service" 
spring.datasource.url=jdbc:mysql://localhost:3306/ratings_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
